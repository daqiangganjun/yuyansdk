import com.android.build.api.variant.BuildConfigField

plugins {
    alias(libs.plugins.android.library)
    alias(libs.plugins.ksp)
    alias(libs.plugins.kotlin.parcelize)
    alias(libs.plugins.kotlin.serialization)
}

kotlin {
    jvmToolchain(libs.versions.jvmToolchain.get().toInteger())
}

// 源码标识取自主仓库（子模块指针随之变化），工作区有改动时追加 -dirty；无 git 环境时为 unknown
def gitOutput = { List<String> command ->
    providers.exec {
        commandLine command
        workingDir = rootDir
        ignoreExitValue = true
    }.standardOutput.asText.map { it.trim() }
}
def appGitHead = gitOutput(['git', 'rev-parse', 'HEAD']).zip(gitOutput(['git', 'status', '--porcelain', '--untracked-files=normal'])) { head, dirty ->
    head.isEmpty() ? 'unknown' : (dirty.isEmpty() ? head : "$head-dirty")
}
def appBuildTime = gitOutput(['git', 'log', '-1', '--pretty=%ai'])

android {
    compileSdk = libs.versions.compileSdk.get().toInteger()
    buildToolsVersion = libs.versions.buildTools.get()
    namespace = 'com.yuyan.imemodule'
    defaultConfig {
        minSdk = libs.versions.minSdk.get().toInteger()
        testInstrumentationRunner = 'androidx.test.runner.AndroidJUnitRunner'
        ndk {
            abiFilters += ['arm64-v8a']
        }
        // 混淆规则随 aar 传递给使用方，避免 app 与本模块重复维护同一份规则
        consumerProguardFiles 'proguard.cfg'
    }

    lint {
        abortOnError = false
    }

    //多渠道打包: app中多渠道配置要一致
    flavorDimensions = ["default"]
    productFlavors {
        offline {
            dimension = "default"
        }
    }

    buildFeatures {
        viewBinding = true
        buildConfig = true
        resValues = true
    }

    buildTypes {
        // 本模块以 project 依赖方式被 app 引用，此处混淆只会造成双重处理，
        // 规则改由上方 consumerProguardFiles 传递给 app 的 R8
        release {
            resValue("string", "app_name", "@string/ime_yuyan_name")
            resValue("drawable", "app_icon", "@drawable/ic_sdk_launcher")
        }
        debug {
            resValue("string", "app_name", "@string/ime_yuyan_name_debug")
            resValue("drawable", "app_icon", "@drawable/ic_sdk_launcher_debug")
        }
    }
    sourceSets {
        offline {
            jniLibs.directories.add(layout.buildDirectory.dir("generated/rime/jniLibs").get().asFile.path)
            assets.directories.add(layout.buildDirectory.dir("generated/rime/assets").get().asFile.path)
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
}

androidComponents {
    onVariants(selector().all()) { variant ->
        variant.buildConfigFields.put("versionName", new BuildConfigField("String", "\"${rootProject.ext.appVersionName}\"", null))
        variant.buildConfigFields.put("AppCommitHead", appGitHead.map { new BuildConfigField("String", "\"$it\"", null) })
        variant.buildConfigFields.put("AppBuildTime", appBuildTime.map { new BuildConfigField("String", "\"$it\"", null) })
    }
}

def nativeSourceRoot = providers.gradleProperty('rimeSourceRoot').orElse(file('native/.cache').absolutePath)
def sdkDirectory = androidComponents.sdkComponents.sdkDirectory
tasks.register('buildRimeNative', Exec) {
    inputs.files(fileTree('native') { exclude '.cache/**', 'build/**', '__pycache__/**' })
    inputs.file('src/main/java/com/yuyan/inputmethod/util/LX17PinYinUtils.kt')
    outputs.dirs(layout.buildDirectory.dir("generated/rime/assets"), layout.buildDirectory.dir("generated/rime/jniLibs"), layout.buildDirectory.dir("generated/rime/dictionary"))
    commandLine 'python', file('native/build_native.py').absolutePath, '--source-root', nativeSourceRoot.get()
    argumentProviders.add({ ['--sdk', sdkDirectory.get().asFile.absolutePath] } as CommandLineArgumentProvider)
    if (providers.gradleProperty('rimeSkipFetch').isPresent()) args '--skip-fetch'
}
tasks.named('preBuild').configure { dependsOn 'buildRimeNative' }

dependencies {
    implementation libs.snakeyaml
    implementation libs.okhttp
    implementation fileTree(dir: 'libs', include: ['*.aar', '*.jar'], exclude: [])
    implementation libs.androidx.appcompat
    implementation libs.androidx.constraintlayout
    implementation libs.google.material
    implementation libs.google.flexbox
    implementation libs.androidx.emoji2
    implementation libs.androidx.emoji2.views
    implementation libs.kotlinx.coroutines.core
    implementation libs.kotlinx.coroutines.android
    implementation libs.kotlinx.serialization.json
    implementation libs.androidx.preference.ktx
    implementation libs.androidx.navigation.fragment.ktx
    implementation libs.androidx.navigation.ui.ktx
    implementation libs.splitties.resources
    implementation libs.splitties.views.dsl.recyclerview
    implementation libs.splitties.views.dsl.constraintlayout
    implementation libs.splitties.views.dsl.appcompat
    implementation libs.androidx.exifinterface
    // 手写识别：搜狗商业库的授权绑定原包名，本分支改名后失效，改用可离线运行的 ML Kit。
    // 注意其中文模型不随包分发，需运行时下载一次，见 MlKitHandwritingModel。
    // 19.0.0 支持 16 KB 页面，编译器需能读取 Kotlin 2.1 元数据。
    //
    // 曾尝试排除 transport-backend-cct（Google 遥测的上传实现）以从源头去除上传能力，
    // 但 ML Kit 的依赖注入图在初始化时即强制实例化 CCTDestination，缺类会直接
    // NoClassDefFoundError 崩溃，故必须保留。改为在 manifest 中移除其后端发现服务与
    // 两个调度器：类虽在，却既注册不到后端也无法被调度，事件无从上传。
    implementation libs.mlkit.digital.ink
    // ML Kit 下载模型所依赖，本为其传递依赖；因 HandwritingService 需在 :hw 进程内
    // 手动 WorkManager.initialize()（自动初始化已在 manifest 中移除）而显式声明
    implementation libs.androidx.work.runtime
    implementation libs.androidx.room.runtime
    ksp libs.androidx.room.compiler
    implementation libs.androidx.room.ktx
}
