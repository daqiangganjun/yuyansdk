# yuyansdk 通过 consumerProguardFiles 传递给使用方的混淆规则。
# 此处只声明本模块必需的保留项，全局混淆选项由 app 模块的 proguard.cfg 提供。

-dontwarn org.apache.**
-dontwarn android.support.v4.**

# JNI 硬绑定：com.yuyan.inputmethod.core 包内的类名、包名、字段名与预编译 .so
# （libyuyanime.so）中的符号一一对应，重命名会导致查找失败
-keep class com.yuyan.inputmethod.core.** { *; }

# libyuyanime.so 的 JNI_OnLoad 除上述类外还会 FindClass("kotlin/Pair") 缓存全局引用。
# kotlin.Pair 在 Java 侧无直接引用，R8 会将其整类移除，导致 native 库一加载即 abort
# （ClassNotFoundException 发生在 JNI_OnLoad 内，表现为 SIGABRT 而非 Java 异常）。
# 该清单由 libyuyanime.so 中的字符串常量确定，新增预编译库时需同步核对。
-keep class kotlin.Pair { *; }

# 含 native 方法的类不可改名
-keepclasseswithmembernames class * {
    native <methods>;
}

# 以下两个字段由本项目反射访问，名称被混淆后会失效。
# 二者都取自 androidx 库的私有实现，升级依赖时需复核字段是否仍然存在。

# AdapterWrapper 在包装侧滑菜单时，把 itemView 反射替换为外层容器。
# 该反射失败会被 catch 吞掉，随后 RecyclerView 因 itemView 已有父视图而抛
# IllegalStateException（表现为打开剪贴板即崩溃），故必须保留字段名。
-keepclassmembers class androidx.recyclerview.widget.RecyclerView$ViewHolder {
    android.view.View itemView;
}

# Functions.kt 反射读取 Preference 的默认值以实现「重置为默认值」。
# 此处无异常保护，字段缺失会直接抛 NoSuchFieldException。
-keepclassmembers class androidx.preference.Preference {
    java.lang.Object mDefaultValue;
}

# 由布局 XML 反射实例化的自定义 View
-keepclasseswithmembers class * {
    public <init>(android.content.Context, android.util.AttributeSet);
}

-keepclasseswithmembers class * {
    public <init>(android.content.Context, android.util.AttributeSet, int);
}

# Parcelable 的 CREATOR 由系统反射读取
-keep class * implements android.os.Parcelable {
    public static final android.os.Parcelable$Creator *;
}

# enum 的 values/valueOf 可能被反射调用
-keepclassmembers enum * {
    public static **[] values();
    public static ** valueOf(java.lang.String);
}

# 主题配置使用 kotlinx.serialization，序列化器入口需保留
-keepclassmembers @kotlinx.serialization.Serializable class ** {
    *** Companion;
    *** INSTANCE;
    kotlinx.serialization.KSerializer serializer(...);
}
